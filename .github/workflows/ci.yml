name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 最小权限：质量检查只需读取源码，不授予任何写权限
permissions:
  contents: read

# 同一分支的连续提交只保留最新一次运行，取消过时的 CI，runner 不被历史提交占满
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 一步跑完：全量用例 + 覆盖率门槛。此前这里 `pnpm test` 与 `vitest run --coverage`
      # 各跑一遍全套（测试执行两遍），coverage 模式本身已包含执行，无需再单列。
      - name: Unit tests · Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm build:budget

      - name: Domain benchmarks
        run: pnpm bench

      - name: Prettier check
        run: pnpm format:check
