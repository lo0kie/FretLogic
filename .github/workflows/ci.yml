name: CI

on:
  push:
    # dev 是长期存在的集成分支：只覆盖 main/master 时，往 dev 推的提交与开向 dev 的 PR
    # 都拿不到任何关卡，问题要等合进 master 才暴露。
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

# 最小权限：质量检查只需读取源码，不授予任何写权限
permissions:
  contents: read

# 同一分支的连续提交只保留最新一次运行，取消过时的 CI，runner 不被历史提交占满
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 关卡清单不在这里抄第二遍 ────────────────────────────────────────────────────────────
      # 唯一来源是 scripts/verify.mjs 的 STEP_NAMES（口径见 rules/03-scoped-verification.md 的 1.2）。
      # 本地 pre-push 与 CI 跑的是**同一个** `pnpm verify`：11 步串行、失败即中止、平时只回显每步的
      # 命令行、只有失败那一步才回放输出。此前两边各抄一份步骤清单，已经漂移过一次（rules/03 与
      # .husky/pre-push 曾把 10 步写成 9 步）—— 加/减一步现在只改 STEP_NAMES，这里不需要动。
      #
      # 本 job 里除 verify 之外只有三步，都不进 verify，各有理由：
      # ① Guidance drift check —— 靠「install 的 prepare 会不会改写工作区」这个 CI 独有的事实，
      #    见下面那一步自身的注释；
      # ② Install Playwright browser —— 环境准备而非关卡：verify 里 test:browser 那一步要有真实
      #    浏览器二进制才跑得动（本地等价命令 `pnpm exec playwright install chromium`）；
      # ③ Domain benchmarks —— 机器相关的回归哨兵，见最后一步自身的注释。

      # 这一条无法交给 verify：它比对的是**提交里的** AGENTS.md 与盘上现算出来的那份，
      # 判据是 git 而非盘上内容。install 会跑根级 prepare（build-guidance.mjs 的**写盘**分支）
      # 就地重写 AGENTS.md，于是 verify 里那步 guidance:check 变成拿它跟它自己比 —— 提交里那份
      # 有多陈旧都判绿。而 HUSKY=0 绕开钩子提交、或直接手改派生文件，本地都没有关卡拦得住。
      # 工作区一旦出现差异即失配：install 之后它只可能是 prepare 重写了 AGENTS.md。
      # 入库的派生出口只此一份：另一份 .github/CHANGELOG.md 不经 prepare，由 verify 的
      # changelog:check 把关（那道关卡的远端版本同样只需要跑 verify）。
      - name: Guidance drift check
        run: |
          git diff --exit-code --stat -- AGENTS.md || {
            echo "AGENTS.md 由 rules/ 派生（scripts/build-guidance.mjs），而 install 的 prepare 已就地重写过它。"
            echo "工作区出现差异 = 提交里那份与 rules/ 失配。请本地跑 pnpm guidance:build 后一并提交。"
            exit 1
          }

      # 环境准备：verify 里 test:browser 那一步要有 Chromium 才跑得动。
      # 顺序上放在 verify 之前 —— 让它与 install 相邻，是「一次把环境备齐」的两步。
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # 完整关卡本身。跑的是与本地 pre-push 逐字同一个驱动器：清单、顺序、失败即中止的口径全在
      # scripts/verify.mjs 里，那边改了这边自动跟上。
      - name: Verify
        run: pnpm verify

      # 回归哨兵：与 scripts/bench-baseline.json 比倍率，超 3x 即失败（绝对毫秒阈值在共享跑机上必抖）。
      # 基线缺失时该步退化为信息性输出并 exit 0 —— 即哨兵未启用，而不是静默通过。
      # 刻意不进 verify：基准是**机器相关**的，开发机上的倍率与 CI 跑机不是一回事，放进去只会
      # 制造「本地红、远端绿」的假信号（本地要看退化请显式跑 pnpm bench）。
      - name: Domain benchmarks
        run: pnpm bench
