name: Deploy to Gitee Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  deploy-gitee:
    name: Build & Push to Gitee Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Gitee (/fret-logic/)
        run: pnpm build:gitee

      - name: Deploy to Gitee Pages branch
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node ./scripts/deploy-gitee.mjs --ci --skip-build
