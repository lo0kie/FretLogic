name: Deploy to GitHub Pages

# 触发：CI 在 main/master 上跑完之后（**代码层强约束**，不再依赖仓库 Branch protection 的人工设置）。
# workflow_run 拿不到原触发事件，故提交号取 github.event.workflow_run.head_sha；
# 保留 workflow_dispatch 供手动重发（手动触发时不受 CI 结论限制）。
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 只有 CI 绿灯才部署；手动 workflow_dispatch 不受此限。
    # 必须显式限定 workflow_run.event == 'push'：CI 同时由 pull_request 触发，而 workflow_run
    # 本身拿不到原触发事件 —— 只靠 branches 过滤不足以防住「fork 的默认分支恰好叫 main」这类
    # 边界，而本 job 带 pages:write + id-token:write、checkout 的又是那次 CI 的 head_sha，
    # 等于在写权限下构建并发布 PR 代码。
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 下必须显式检出「那次 CI 跑的那个提交」：默认检出的是默认分支 HEAD，
          # 若两次提交间隔很短会部署到与绿灯不同的代码上
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 质量门禁全部由 ci.yml 承担（Changelog 一致性、Lint、Typecheck、Test、Build、体积预算、
      # Bench 回归哨兵、Prettier；完整清单以该文件为准，此处不再抄一份以免两处漂移），
      # 本工作流经 workflow_run 只在 CI 绿灯后启动，故此处不再重复 verify.mjs（否则同一提交会各跑一套，
      # 白白翻倍）。这里只构建产物供上传。
      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
