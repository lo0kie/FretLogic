name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 质量门禁统一由 ci.yml 承担（Lint/Typecheck/Test/Coverage/Budget/Bench/Prettier）。
      # 此处在 push 时不再重复 verify.mjs，否则每次提交 CI + Deploy 会各跑一套 lint/test/
      # typecheck/build，白白翻倍。这里只构建产物供上传；质量失败由 ci.yml 的红灯暴露。
      # 若需把 ci.yml 设为合并/推送强约束，请在仓库 Branch protection 中将其设为 required check。
      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
