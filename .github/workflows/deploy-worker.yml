name: Deploy Sync Worker

on:
  push:
    branches: [master]
    # 仅当云同步后端源码或配置变更时才部署，避免每次 push 都发版
    paths:
      - 'worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 最小权限：部署仅需读取仓库源码，绝不授予写权限
    permissions:
      contents: read
    # 防止并发部署互相覆盖：同一时间只允许一个部署在跑
    concurrency:
      group: deploy-worker-prod
      cancel-in-progress: false
    # 生产发布门禁：环境名与仓库 Settings → Environments 中的既有环境大小写完全一致（Production）。
    # 保护规则（必需审批人 / 部署分支）在该环境上配置；若环境不存在，GitHub 会静默自动创建「无规则」环境，
    # 门禁会形同虚设，故名字必须精确匹配既有环境。
    environment: Production
    # 限制最长运行时间，避免异常时无限挂起占用 runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy worker to Cloudflare (prod)
        # 凭据经 Repo Secrets 注入环境变量，由 worker/scripts/deploy-worker.mjs 交给 wrangler（无需 .env）：
        # SERVER_TOKEN 由该脚本以 `wrangler secret put` 加密写入（不经 --var，不留明文在部署历史）。
        # 必须显式 :prod——部署脚本的缺省目标是 dev，只有这里有权发布生产
        # 上面的 paths 含 worker/scripts/：改打包/部署脚本本身也会触发重新发版
        run: pnpm deploy:worker:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
