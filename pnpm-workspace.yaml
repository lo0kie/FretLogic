packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  unrs-resolver: true
  vue-demi: true
  # workerd = Cloudflare Workers 官方运行时二进制（wrangler 的依赖，deploy:worker 链路）。
  # postinstall 需要下载平台二进制，必须允许构建脚本，否则 wrangler 起不来
  workerd: true

overrides:
  dompurify: ^3.4.14
  nanoid: ^3.3.18
  postcss: ^8.5.23

patchedDependencies:
  '@ianvs/prettier-plugin-sort-imports': patches/@ianvs__prettier-plugin-sort-imports.patch
  prettier-plugin-organize-attributes: patches/prettier-plugin-organize-attributes.patch

peerDependencyRules:
  allowedVersions:
    eslint: '10'
