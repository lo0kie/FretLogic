<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link href="/favicon.png" rel="icon" type="image/png" />
    <!-- `interactive-widget=resizes-content`：软键盘弹出时**同时压缩布局视口与视觉视口**。
         Chrome 108 起的默认是 `resizes-visual`（只压缩视觉视口），此时布局视口、`100vh`、`100dvh`
         都不随键盘变 —— 浮层（本项目的弹窗都是 `fixed inset-0` + 居中）会停在原处、被键盘盖住，
         收起键盘时又整体跳一次（用户报的「在 modal 的 input 里关闭输入法，modal 会从屏幕中间高度
         复位」就是这一条）。加上它之后 `dvh` / `vh` / `innerHeight` 一起跟随键盘，居中定位自然正确，
         零 JS。`dvh` 本身早已在用（见 BaseModal 的 max-height），但**没有这一项时它不响应键盘**。
         只影响 Chrome / Android 系；iOS Safari 不支持该属性（它不压缩布局视口，走「整体上移页面」
         那条路，故不受影响也不受益）。 -->
    <meta content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" name="viewport" />
    <title>FretLogic</title>
    <script>
      // 首帧防闪白：在 CSS 应用前读 cookie 中的主题偏好并预置 data-theme / .dark。
      // 主题偏好存 cookie（同步可读）；IDB 只有异步 API，内联脚本拿不到，故不能替代 cookie。
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)fret-logic:theme-preference=([^;]*)/);
          var p = m ? m[1] : 'auto';
          // 畸形值（cookie 被手工改坏）一律按 auto 处理，与 useTheme 的 readPreference 同口径 ——
          // 否则这里按 light 铺一帧、应用初始化又回退 auto，系统暗色下会闪一次 light → dark。
          if (p !== 'dark' && p !== 'light' && p !== 'high-contrast') p = 'auto';
          var dark =
            p === 'dark' ||
            (p === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : p === 'high-contrast' ? 'high-contrast' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          if (dark) root.classList.add('dark');
        } catch (e) {
          /* 解析失败交由应用初始化时兜底 */
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
